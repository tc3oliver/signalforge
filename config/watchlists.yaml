# Concrete entities to track per collector -- SHIPPED DEFAULT.
#
# As with interests.yaml, this is an example of the shape. Copy it to
# `watchlists.local.yaml` (gitignored, wins outright) and put your own entities
# in it.
#
# These lists are a cost as well as a preference: every repository here is
# polled for releases and tags on every run, and every subreddit and channel is
# fetched. Keep each list to things you would genuinely want woken up about.
#
# Each list may be empty. A collector with an empty watchlist simply has nothing
# to do and reports that honestly rather than failing.

# owner/name. Polled for releases and version tags.
github_repos:
  - modelcontextprotocol/servers
  - postgres/postgres

# ticker, name, and the 10-digit zero-padded SEC CIK. `cik: null` is allowed
# where you have not looked one up yet; that company is then skipped.
sec_companies:
  - ticker: NVDA
    name: NVIDIA Corp
    cik: "0001045810"

# CoinGecko asset id and its display symbol.
crypto_assets:
  - id: bitcoin
    symbol: BTC

# FRED series id and the label to show for it.
fred_series:
  - id: FEDFUNDS
    label: "Federal Funds Effective Rate"
  - id: CPIAUCSL
    label: "Consumer Price Index for All Urban Consumers"

# Subreddit names, without the "r/" prefix.
subreddits:
  - MachineLearning

# Channel handle (@name) or UC... channel ID. A handle has to be resolved to an
# ID through the Data API, which needs YOUTUBE_API_KEY; without that key,
# handles are skipped with a warning rather than requested and 404ed. Plain
# UC... ids need no credential.
youtube_channels: []

# arXiv category codes: https://arxiv.org/category_taxonomy
arxiv_categories:
  - cs.CL
  - cs.LG
