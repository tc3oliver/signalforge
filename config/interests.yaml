# Reader interest profile -- SHIPPED DEFAULT.
#
# This is an example, not a recommendation. Copy it to `interests.local.yaml`
# (gitignored, and it wins outright when present) and replace every topic with
# your own before the brief means anything to you.
#
# This file is the single largest determinant of what reaches your brief. It
# drives prompt construction (what the curator is told to look for) and scoring
# (how it weighs what it found).
#
#   id       stable key; referenced by discovery.yaml topicIds
#   label    human name, used in prompts and in the web reader
#   weight   0-1 relative importance. Reserve 1.0 for a handful of things, or
#            everything is important and nothing is.
#   keywords literal strings matched against titles and summaries
#   aliases  alternate spellings for the same topic
topics:
  - id: ai-llm
    label: AI / LLM
    weight: 1.0
    keywords: [ai, "artificial intelligence", llm, "large language model", "foundation model"]
    aliases: [genai, "generative ai"]

  - id: developer-tools
    label: Developer Tools
    weight: 0.8
    keywords: ["developer tools", "build system", compiler, "package manager", ide]
    aliases: [devtools, tooling]

  - id: open-source
    label: Open Source
    weight: 0.7
    keywords: ["open source", "open-weight", license, foundation, maintainer]
    aliases: [oss, floss]

  - id: security
    label: Security
    weight: 0.75
    keywords: [vulnerability, cve, breach, exploit, "supply chain", advisory]
    aliases: [infosec, appsec]

  - id: infrastructure
    label: Infrastructure
    weight: 0.6
    keywords: [kubernetes, database, postgres, observability, "cloud provider", outage]
    aliases: [devops, sre, platform]
