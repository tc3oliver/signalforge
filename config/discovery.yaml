# Scheduled web-research queries -- SHIPPED DEFAULT.
#
# These run on a cadence to surface stories that the keyword-driven collectors
# (rss, github, hackernews) would miss entirely, because nothing in your feeds
# happened to carry them. They cost a web-search call each and need a research
# credential (TAVILY_API_KEY, with Exa as the fallback route); with no such
# credential the whole discovery pass is skipped and the run continues.
#
# Copy to `discovery.local.yaml` (gitignored, wins outright) and write queries
# for your own topics. `topicIds` must name ids that exist in your interests
# config -- that is how a discovered item inherits a weight.
#
# An empty `queries: []` is valid and disables discovery entirely.
queries:
  - id: ai-model-releases
    query: "new open weight model release"
    schedule: daily
    maxResults: 10
    topicIds: [ai-llm, open-source]

  - id: developer-tool-launches
    query: "developer tool launch OR major release"
    schedule: weekly
    maxResults: 10
    topicIds: [developer-tools]
