# Scheduled Tavily discovery queries: run on a cadence to surface stories that
# keyword-based collectors (rss/github/hackernews) would miss entirely.
queries:
  - id: coding-agent-landscape
    query: "new coding agent OR AI agent release Claude Code OpenCode"
    schedule: daily
    maxResults: 10
    topicIds: [coding-agents, claude-code, opencode]

  - id: inference-stack-news
    query: "vLLM OR ROCm OR AITER inference performance release"
    schedule: daily
    maxResults: 10
    topicIds: [inference, vllm, rocm, aiter]

  - id: open-weight-models
    query: "new open weight model release Qwen OR DeepSeek OR Hermes"
    schedule: daily
    maxResults: 10
    topicIds: [qwen, deepseek, hermes, local-llm]

  - id: mcp-ecosystem
    query: "Model Context Protocol MCP server new release"
    schedule: weekly
    maxResults: 10
    topicIds: [mcp, developer-tools]

  - id: crypto-macro-weekly
    query: "Bitcoin Ethereum Solana price outlook Fed rate decision"
    schedule: weekly
    maxResults: 10
    topicIds: [btc, eth, sol, macro]
