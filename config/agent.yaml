# Agent runtime tuning.
#
# modelChain is the fallback order: the first entry is tried first, and each
# later entry is a cheaper last resort. This file is authoritative -- the daily
# CLI reads it -- and MODEL_CHAIN in src/runtime/model-config.ts is the
# compiled-in default it must agree with (tests/model-chain-config.test.ts
# enforces that).
#
# `provider` is whatever the installed Pi agent can authenticate as; run
# `pi models` to list what is available to you. The three below route through
# subscription-backed providers, which is what this machine happens to have.
# If you are setting this up yourself, you most likely want a chain of
# direct-API providers instead, for example:
#
#   modelChain:
#     - provider: anthropic
#       model: claude-sonnet-5
#     - provider: openai
#       model: gpt-5.6
#
# authenticated with Pi (`pi auth login`, or the provider's own environment
# variable such as ANTHROPIC_API_KEY where Pi documents one). Model
# authentication is Pi's: SignalForge never stores a model credential, and
# ~/.config/daily-intelligence/secrets.env is for collector credentials.
# See docs/CREDENTIALS.md. Nothing in the pipeline depends on which providers
# these are, only that there are one or more of them and that the first is the
# most capable.
modelChain:
  - provider: github-copilot
    model: gemini-3.8-flash
  - provider: openai-codex
    model: gpt-5.6-sol
  - provider: opencode-go
    model: deepseek-v4.1-flash

stages:
  CURATOR:
    timeoutMs: 300000
    maxAttemptsPerModel: 4
    maxNudges: 3
  EDITOR:
    timeoutMs: 300000
    maxAttemptsPerModel: 4
    maxNudges: 3

searchWeb:
  # Budget for the search_web tool available to Pi during curation/editing.
  maxQueryLength: 400
  maxResults: 5
  timeoutMs: 15000
  maxCallsPerStory: 3
  maxCallsPerRun: 20
