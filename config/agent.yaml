# Agent runtime tuning.
#
# modelChain is the fallback order: the first entry is tried first, and each
# later entry is a cheaper last resort. This file is authoritative -- the daily
# CLI reads it -- and MODEL_CHAIN in src/runtime/model-config.ts is the
# compiled-in default it must agree with (tests/model-chain-config.test.ts
# enforces that).
#
# `provider` is whatever the installed Pi agent can authenticate as; run
# `pi models` to list what is available to you. The three below route through
# subscription-backed providers, which is what this machine happens to have.
# If you are setting this up yourself, you most likely want a chain of
# direct-API providers instead, for example:
#
#   modelChain:
#     - provider: anthropic
#       model: claude-sonnet-5
#     - provider: openai
#       model: gpt-5.6
#
# authenticated with Pi (`pi auth login`, or the provider's own environment
# variable such as ANTHROPIC_API_KEY where Pi documents one). Model
# authentication is Pi's: SignalForge never stores a model credential, and
# ~/.config/daily-intelligence/secrets.env is for collector credentials.
# See docs/CREDENTIALS.md. Nothing in the pipeline depends on which providers
# these are, only that there are one or more of them and that the first is the
# most capable.
modelChain:
  - provider: github-copilot
    model: gemini-3.8-flash
  - provider: openai-codex
    model: gpt-5.6-sol
  - provider: opencode-go
    model: deepseek-v4.1-flash

stages:
  CURATOR:
    timeoutMs: 300000
    maxAttemptsPerModel: 4
    maxNudges: 3
    # Decisions one attempt records before it yields to a fresh session on the
    # SAME model, resuming from durable state. This is what makes the curator a
    # bounded resumable worker instead of one turn trying to finish a whole day.
    #
    # timeoutMs above is now only what its name says: a bound on a hung turn. It
    # used to double as "the most items a run can ever decide", because the scan
    # happened inside one turn -- so a 1626-item backlog on 2026-09-16 timed out
    # six times while making steady progress, and the router read each timeout as
    # a provider fault and burned all three models in 28 minutes.
    #
    # Sized from the SLOW end of measured throughput, not the middle. Over the
    # six bounded turns of that day's recovery: p50 2.40 s/decision, p90 3.45,
    # max 6.00 -- a threefold spread, with three of six turns ending on the clock
    # instead of on the ceiling. 50 x 3.45s = 172s, 57% of the clock, and it
    # still fits at the observed maximum. It also leaves room for the model to
    # wind down: one turn exhausted its budget and still ran to the clock, so the
    # ceiling is not instantaneous.
    #
    # Since 2026-09-18 this count is a backstop rather than the only bound: the
    # work unit also closes once the turn has spent 60% of timeoutMs (180s), so a
    # slow turn stops at a tool boundary instead of being aborted by the timeout.
    # On 2026-09-18, 24 of 26 units closed on the count at p50 125s -- 42% of the
    # clock -- and two still ran past it; the clock now catches those two.
    #
    # Raise it only with telemetry showing p90 well under 3s/decision.
    # 2026-09-18 measured p50 2.50, p90 3.96, max 6.00 -- p90 does not meet that
    # bar, so the count stays at 50 even though the soft deadline now covers the
    # slow tail.
    maxDecisionsPerTurn: 50
  EDITOR:
    timeoutMs: 300000
    maxAttemptsPerModel: 4
    maxNudges: 3

searchWeb:
  # Budget for the search_web tool available to Pi during curation/editing.
  maxQueryLength: 400
  maxResults: 5
  timeoutMs: 15000
  maxCallsPerStory: 3
  maxCallsPerRun: 20

# Screening: the cheap breadth stage.
#
# One stateless model verdict per item -- DROP / KEEP / UNSURE -- formed from
# title + summary alone, written to item_screening. It exists because the
# expensive part of a run is not judging each item once; it is that every item
# on a page stays in the Curator's context and is re-sent on each of the
# ~25 model turns that page takes, ~70% of those items being ones the Curator
# will call IRRELEVANT. The screener reads each item once, in a request that is
# thrown away afterwards, so the Curator's page holds only what survived.
#
# It is NOT part of modelChain and deliberately has no tools, no skill, no
# session and no fallback: a screener that could look things up would start
# spending tokens on the questions the Curator exists to answer.
#
# mode:
#   off     nothing runs.
#   shadow  every item is screened and every item still reaches the Curator;
#           `pnpm observe` compares the verdicts with what the Curator did.
#   route   DROP verdicts from the trusted (model, policyVersion) below are
#           withheld from the Curator's default scan. Everything else -- KEEP,
#           UNSURE, unscreened, audit-sampled DROP, an untrusted version -- is
#           offered exactly as before. A withheld item is not erased: it stays
#           in the manifest, search_items still finds it, and the Curator may
#           rescue it by deciding it. Every failure fails open to the Curator
#           and marks the run degraded so the reversion is visible.
#
# Nothing switches shadow -> route by itself. `pnpm observe` prints a verdict
# (READY TO ROUTE / KEEP SHADOWING / NOT WORTH ROUTING); a human edits this.
#
# Evidence epochs: bumping `policyVersion` (any prompt change) or `model`
# starts a new epoch. Until routing.trustedModel / trustedPolicyVersion are
# updated to match, the new version screens in shadow whatever `mode` says.
screening:
  mode: route
  provider: openai
  baseUrl: https://api.openai.com/v1
  model: gpt-5.6-terra
  apiKeySecret: OPENAI_API_KEY
  # v3 is the policy the 2026-09-16..18 backtest (3971 items, `pnpm screen`)
  # settled on: DROP 49.2%, DROP precision 96.9%, final-story and Must Know
  # recall 100% on every day, two tier-B material stories lost across the
  # three days. v1 dropped 28% with the same recall; v2 dropped 61% and lost a
  # Must Know story. The policies are in src/screening/screener.ts.
  policyVersion: screening-v3
  batchSize: 40
  concurrency: 8
  # Per-request bound. 60s was measured against one batch in isolation (27s);
  # at 8 in flight the 2026-09-18 backtest saw 11 of 33 batches exceed it, and
  # a timed-out batch is 40 items that fail open to the Curator for nothing.
  timeoutMs: 150000
  # Shadow: a ceiling on a pass that overlaps curation and delays nothing.
  # Route: how long the run waits for the workset before failing open.
  # Measured 2026-09-18 against gpt-5.6-terra at batchSize 40: ~27s per batch,
  # ~215 tokens per item; a 1311-item day is ~33 batches, ~5 rounds at 8 in
  # flight, ~135s.
  maxWallClockMs: 900000
  # Fraction of DROPs offered to the Curator anyway, chosen deterministically
  # from hash(date, itemId, policyVersion), so a routed day keeps producing
  # ground truth about its own DROPs.
  #
  # Held at 10% for the first week of routing rather than the 5% the backtest
  # used. A routed day's only continuous evidence about what it withheld is
  # this sample, and the first week is when an unmeasured drift would be
  # cheapest to catch. Lower it deliberately, from telemetry, never on a
  # schedule.
  auditDropSampleRate: 0.10
  # The measured pair. Routing withholds nothing unless the configured model
  # and policyVersion equal these, so changing either above reverts the run to
  # shadow until the new version has been measured in its own right.
  #
  # Enabled 2026-09-19 on the evidence of a full routed replay of 2026-09-18
  # against that day's production run: 579 of 1311 items withheld, zero final
  # and zero Must Know stories lost, 3 of 66 material stories lost (all tier
  # B/C, none in the brief), 38 audit-sampled DROPs all judged IRRELEVANT,
  # no rescue needed, Curator tokens 5.35M -> 3.17M and wall clock 62.5 ->
  # 43.9 minutes against a same-code control run with screening off.
  routing:
    trustedModel: gpt-5.6-terra
    trustedPolicyVersion: screening-v3

# Evidence distillation: reading one long source, once, for the Curator.
#
# A Curator tool result is re-sent on every later turn of its work unit --
# measured at six occurrences for a mid-unit read -- so pulling a 97,000-char
# article into the session costs it six times over. On 2026-09-19 three such
# reads accounted for an estimated 156,000 tokens, 86% of the gap between the
# work units that made one and the comparable ones that did not.
#
# `get_item_evidence` asks one question of up to five items. A stateless,
# tool-free request to the cheap model answers it and proposes passages; the
# server then locates each passage in the source and discards what it cannot
# find, so a quotation the Curator sees is the source's own characters at a
# real offset, never the model's string.
#
# Why not just search the body, which costs nothing? Because a keyword can only
# be aimed at what the summary already mentions. Tested blind on the day's
# items, a proposed keyword missed entirely 31% of the time, and on the Must
# Know story it would have led to the one case the article says had NO effect
# -- returning evidence for the opposite of the published judgement. Searching
# stays available as `read_item_body`, and is the right tool once you know what
# you are looking for.
#
# OFF, on the evidence, and this is the measurement that decided it.
#
# The case above was made against a 2,000-char search window. Re-measured at
# the 3,000-char window `read_item_body` actually ships, a blind keyword search
# reaches 22 of 22 decisive facts across nine production items, at 1.2 windows
# per fact. The distilled packet reached 20, 21 and 22 of 22 on three identical
# passes -- and in the pass that scored 20 it discarded its own best evidence,
# the sentence carrying the decisive fact, because the model had reconstructed
# it across markup rather than copying it.
#
# So the packet matches a deterministic reader at best, falls below it on two
# runs in three, varies between identical passes where a reader does not, and
# costs a network round trip, roughly 3,100 tokens per document, 6-15s of
# latency and about one transport failure in twelve. A model stage that buys no
# measured quality and no tokens should not run.
#
# What actually solved the mid-document problem was flattening HTML to prose.
# The Must Know source is 16,419 characters of markup and 4,765 of prose, so a
# single window now covers 63% of it. The search term was never the hard part.
#
# The code, its grounding verifier and its tests stay, because one condition
# would revive this: canonical prose is currently small, p99 19,498 chars with
# only 9 of 993 items over 20,000. `find` degrades as bodies grow. If the
# manifest shifts toward long full-text sources, measure again rather than
# assuming either way.
evidence:
  enabled: false
  provider: openai
  baseUrl: https://api.openai.com/v1
  model: gpt-5.6-terra
  apiKeySecret: OPENAI_API_KEY
  # The real use is sibling coverage of one event: one question, several items.
  maxItemsPerCall: 5
  # Beyond five located passages they restate each other.
  maxQuotesPerItem: 5
  # A ceiling, not a target. Measured demand was four detail reads a day.
  maxCallsPerRun: 40
  # Distillation measured 6-15s per document, median 12.7s.
  timeoutMs: 60000
