# Agent runtime tuning. The model chain mirrors src/runtime/model-config.ts
# (MODEL_CHAIN) — kept here too so ops can see/tune it without a code change;
# the loader does not enforce identity with the TS constant.
modelChain:
  - provider: github-copilot
    model: gemini-3.8-flash
  - provider: openai-codex
    model: gpt-5.6-sol
  - provider: opencode-go
    model: deepseek-v4.1-flash

stages:
  CURATOR:
    timeoutMs: 300000
    maxAttemptsPerModel: 4
    maxNudges: 3
  EDITOR:
    timeoutMs: 300000
    maxAttemptsPerModel: 4
    maxNudges: 3

searchWeb:
  # Budget for the search_web tool available to Pi during curation/editing.
  maxQueryLength: 400
  maxResults: 5
  timeoutMs: 15000
  maxCallsPerStory: 3
  maxCallsPerRun: 20
