# Per-collector operational settings. One entry per SourceType value in
# src/schemas/item.ts. `requiredSecrets` names logical secrets resolved via
# src/config/secrets.ts (env, then Keychain) — never a literal value.
collectors:
  rss:
    # Implemented as the "miniflux" collector: pulls from a self-hosted Miniflux instance.
    enabled: true
    # Fallback only. A Miniflux instance's address is per-machine, so MINIFLUX_URL
    # in the environment (i.e. secrets.env) overrides this; see applyEnvOverrides
    # in src/config/loader.ts.
    baseUrl: "http://localhost:8080"
    rateLimitPerMinute: 60
    timeoutMs: 10000
    pageSize: 100
    requiredSecrets: [MINIFLUX_API_KEY]

  web:
    # NOT a collector. Web research is a curator tool (`search_web`, routed
    # Tavily -> Exa in src/research/), reached during curation with a story in
    # hand, never a bulk feed pulled ahead of time. The entry stays so the
    # timeout and rate limit have one home, but it must stay disabled: an
    # enabled source with no collector behind it is reported as such by
    # `unimplementedOutcomes` in src/pipeline/collection.ts.
    enabled: false
    rateLimitPerMinute: 30
    timeoutMs: 15000
    pageSize: 10
    requiredSecrets: [TAVILY_API_KEY]

  github:
    enabled: true
    rateLimitPerMinute: 30
    timeoutMs: 10000
    pageSize: 50
    requiredSecrets: [GITHUB_TOKEN]

  hackernews:
    enabled: true
    rateLimitPerMinute: 60
    timeoutMs: 10000
    pageSize: 50
    requiredSecrets: []
    # Score floor. This collector reads topstories, beststories AND newstories,
    # and newstories is unranked -- every submission in arrival order, most of
    # them never voted on. Those arrive with a score of 1 or 2 and still cost a
    # full Curator decision each.
    #
    # 2026-09-18, a 1311-item day of which 366 were HN: the 320 items scoring
    # under 20 produced 15 candidates, 3 of which reached materials and NONE of
    # which reached the published brief -- while taking 24% of the day's curation
    # workload, roughly thirteen minutes of model time.
    #
    # One day of evidence, so it is set where that day's data is unambiguous and
    # no lower. Set to 0 to disable; a run reports what it dropped as a warning,
    # so raising or lowering this is measurable rather than a matter of opinion.
    minScore: 20

  arxiv:
    enabled: true
    rateLimitPerMinute: 20
    # Read through the per-category announcement feeds (rss.arxiv.org), not the
    # export API: that API answered every request from here with 429 for three
    # days straight, with no Retry-After to back off against. The feeds are
    # cached and answer quickly, but arXiv can still be slow when busy, so the
    # ceiling stays generous. pageSize is unused -- one feed is one day.
    timeoutMs: 45000
    pageSize: 50
    requiredSecrets: []

  semantic-scholar:
    enabled: true
    rateLimitPerMinute: 10
    timeoutMs: 15000
    pageSize: 25
    requiredSecrets: [SEMANTIC_SCHOLAR_API_KEY]

  coingecko:
    enabled: true
    rateLimitPerMinute: 30
    timeoutMs: 10000
    pageSize: 50
    requiredSecrets: []

  fred:
    enabled: true
    rateLimitPerMinute: 60
    timeoutMs: 10000
    pageSize: 100
    requiredSecrets: [FRED_API_KEY]

  sec:
    # Disabled until a real contact User-Agent is supplied: SEC EDGAR requires
    # "Name email@example.com" on every request and will rate-limit or block an
    # IP that omits or fakes one, so there is no safe placeholder to ship here.
    # Set userAgent, then flip enabled: true.
    enabled: false
    rateLimitPerMinute: 10
    timeoutMs: 15000
    pageSize: 40
    requiredSecrets: []

  reddit:
    enabled: false
    rateLimitPerMinute: 30
    timeoutMs: 10000
    pageSize: 25
    requiredSecrets: [REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET]

  youtube:
    # RSS per watchlist channel plus Data API discovery. Without YOUTUBE_API_KEY
    # the discovery half is skipped and @handles cannot be resolved, so the
    # collector reports DEGRADED rather than failing.
    enabled: true
    rateLimitPerMinute: 30
    timeoutMs: 10000
    pageSize: 25
    requiredSecrets: [YOUTUBE_API_KEY]
