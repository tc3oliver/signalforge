# Per-collector operational settings. One entry per SourceType value in
# src/schemas/item.ts. `requiredSecrets` names logical secrets resolved via
# src/config/secrets.ts (env, then Keychain) — never a literal value.
collectors:
  rss:
    # Implemented as the "miniflux" collector: pulls from a self-hosted Miniflux instance.
    enabled: true
    baseUrl: "http://localhost:8080"
    rateLimitPerMinute: 60
    timeoutMs: 10000
    pageSize: 100
    requiredSecrets: [MINIFLUX_API_KEY]

  web:
    # NOT a collector. Web research is a curator tool (`search_web`, routed
    # Tavily -> Exa in src/research/), reached during curation with a story in
    # hand, never a bulk feed pulled ahead of time. The entry stays so the
    # timeout and rate limit have one home, but it must stay disabled: an
    # enabled source with no collector behind it is reported as such by
    # `unimplementedOutcomes` in src/pipeline/collection.ts.
    enabled: false
    rateLimitPerMinute: 30
    timeoutMs: 15000
    pageSize: 10
    requiredSecrets: [TAVILY_API_KEY]

  github:
    enabled: true
    rateLimitPerMinute: 30
    timeoutMs: 10000
    pageSize: 50
    requiredSecrets: [GITHUB_TOKEN]

  hackernews:
    enabled: true
    rateLimitPerMinute: 60
    timeoutMs: 10000
    pageSize: 50
    requiredSecrets: []

  arxiv:
    enabled: true
    rateLimitPerMinute: 20
    # arXiv's export API routinely takes 15-20s to answer when busy, and answers
    # a burst with 429 + Retry-After. 15s turned normal slowness into a FAILED
    # collector; 45s leaves room for the slow-but-successful case.
    timeoutMs: 45000
    pageSize: 50
    requiredSecrets: []

  semantic-scholar:
    enabled: true
    rateLimitPerMinute: 10
    timeoutMs: 15000
    pageSize: 25
    requiredSecrets: [SEMANTIC_SCHOLAR_API_KEY]

  coingecko:
    enabled: true
    rateLimitPerMinute: 30
    timeoutMs: 10000
    pageSize: 50
    requiredSecrets: []

  fred:
    enabled: true
    rateLimitPerMinute: 60
    timeoutMs: 10000
    pageSize: 100
    requiredSecrets: [FRED_API_KEY]

  sec:
    # Disabled until a real contact User-Agent is supplied: SEC EDGAR requires
    # "Name email@example.com" on every request and will rate-limit or block an
    # IP that omits or fakes one, so there is no safe placeholder to ship here.
    # Set userAgent, then flip enabled: true.
    enabled: false
    rateLimitPerMinute: 10
    timeoutMs: 15000
    pageSize: 40
    requiredSecrets: []

  reddit:
    enabled: false
    rateLimitPerMinute: 30
    timeoutMs: 10000
    pageSize: 25
    requiredSecrets: [REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET]

  youtube:
    enabled: false
    rateLimitPerMinute: 30
    timeoutMs: 10000
    pageSize: 25
    requiredSecrets: [YOUTUBE_API_KEY]
